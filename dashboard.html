<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ศูนย์จัดการ Bot Link Auto</title><style>
:root{font-family:Tahoma,"Noto Sans Thai",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:24px}h1{font-size:32px;margin:0 0 8px}.sub{font-size:18px;color:#526079}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}.card,.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 18px #18315318}.num{font-size:38px;font-weight:700;color:#1455cc}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#e8eef9;color:#183153}button.primary{background:#1455cc;color:#fff}button.danger{background:#b42318;color:#fff}input{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid #cbd5e1;border-radius:12px;margin:8px 0 16px}table{width:100%;border-collapse:collapse;font-size:17px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5e7eb;vertical-align:top}th{background:#edf3ff}.scroll{overflow:auto}.hidden{display:none}.badge{display:inline-block;border-radius:99px;padding:5px 10px;background:#e8eef9}.ok{background:#d7f7df;color:#126b2b}.warn{background:#fff0c2;color:#7a5400}@media(max-width:650px){.wrap{padding:14px}h1{font-size:27px}table{font-size:15px}.hide-mobile{display:none}}
</style></head><body><div class="wrap">
<section id="login" class="panel" style="max-width:520px;margin:12vh auto"><h1>🔐 เข้าสู่ระบบผู้ดูแล</h1><p class="sub">กรอกรหัสผ่านผู้ดูแล</p><input id="password" type="password" autofocus><button class="primary" onclick="login()">เข้าสู่ระบบ</button><p id="loginError" style="color:#b42318"></p></section>
<main id="app" class="hidden"><h1>ศูนย์จัดการ Bot Link Auto</h1><div class="sub">ตัวหนังสือใหญ่ เมนูง่าย ตรวจสถานะได้ในหน้าเดียว</div><div id="cards" class="cards"></div>
<div class="tabs"><button class="primary" onclick="show('runtime')">สถานะระบบ</button><button onclick="show('payments')">การชำระเงิน</button><button onclick="show('users')">ลูกค้า</button><button onclick="show('links')">คลังลิงก์</button><button onclick="show('packages')">ราคาแพ็กเกจ</button><button onclick="refreshAll()">↻ โหลดใหม่</button></div>
<section class="panel"><div id="content">กำลังโหลด…</div></section></main></div>
<script>
let data={},current='runtime';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...opt});const j=await r.json();if(r.status===401){document.querySelector('#login').classList.remove('hidden');document.querySelector('#app').classList.add('hidden');throw Error(j.error)}if(!r.ok)throw Error(j.error||'เกิดข้อผิดพลาด');return j}
async function login(){const loginBox=document.querySelector('#login'),appBox=document.querySelector('#app'),errorBox=document.querySelector('#loginError');try{await api('/api/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});errorBox.textContent='';loginBox.classList.add('hidden');appBox.classList.remove('hidden');await refreshAll()}catch(e){errorBox.textContent=e.message}}
async function refreshAll(){try{const [stats,runtime,payments,users,links,packages]=await Promise.all(['/api/stats','/api/runtime','/api/payments','/api/users','/api/links','/api/packages'].map(api));data={stats,runtime,payments,users,links,packages};cards.innerHTML=[['ลูกค้า',stats.users],['ลิงก์พร้อมขาย',stats.links],['ส่งลิงก์แล้ว',stats.deliveries],['จ่ายสำเร็จ',stats.paidPayments],['รอชำระ',stats.pendingPayments]].map(x=>`<div class=card><div>${x[0]}</div><div class=num>${x[1]??0}</div></div>`).join('');show(current)}catch(e){content.textContent=e.message}}
function show(name){current=name;const rows=data[name]||[];if(name==='runtime')content.innerHTML='<h2>สถานะระบบ</h2>'+table(['ส่วน','สถานะ','รายละเอียด','อัปเดต'],rows.map(x=>[x.name,`<span class="badge ${x.status==='ready'?'ok':'warn'}">${esc(x.status)}</span>`,esc(x.detail),date(x.updated_at)]));
if(name==='payments')content.innerHTML='<h2>การชำระเงิน</h2>'+table(['เวลา','ลูกค้า','แพ็กเกจ','ยอด','สถานะ'],rows.map(x=>[date(x.created_at),esc(x.user_id),esc(x.packages?.name),`${x.amount_thb} บาท`,`<span class=badge>${esc(x.status)}</span>`]));
if(name==='users')content.innerHTML='<h2>ลูกค้า</h2>'+table(['ชื่อ','เครดิต','สมาชิกถึง','ผู้แนะนำ','เริ่มใช้'],rows.map(x=>[esc(x.display_name||x.username||x.telegram_id),x.credits,date(x.subscription_until),esc(x.invited_by||'-'),date(x.created_at)]));
if(name==='links')content.innerHTML='<h2>คลังลิงก์</h2>'+table(['เวลา','ลิงก์','สถานะ','จัดการ'],rows.map(x=>[date(x.created_at),`<a href="${esc(x.telegram_url)}" target=_blank>${esc(x.telegram_url)}</a>`,x.active?'เปิด':'ปิด',`<button onclick="toggleLink('${x.id}',${!x.active})">${x.active?'ปิด':'เปิด'}</button>`]));
if(name==='packages')content.innerHTML='<h2>ราคาแพ็กเกจ</h2><p>กดบันทึกทีละรายการ</p>'+rows.map(x=>`<div class=card><b>${esc(x.id)}</b><input id="n_${x.id}" value="${esc(x.name)}"><input id="d_${x.id}" value="${esc(x.description)}"><label>ราคา บาท</label><input id="p_${x.id}" type=number value="${x.price_thb}"><label><input id="a_${x.id}" type=checkbox ${x.active?'checked':''} style="width:auto"> เปิดขาย</label><br><button class=primary onclick="savePackage('${x.id}')">บันทึก</button></div>`).join('')}
function table(h,r){return `<div class=scroll><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function date(x){return x?new Date(x).toLocaleString('th-TH'):'-'}
async function toggleLink(id,active){await api(`/api/links/${id}/toggle`,{method:'POST',body:JSON.stringify({active})});refreshAll()}async function savePackage(id){await api(`/api/packages/${id}`,{method:'POST',body:JSON.stringify({name:document.querySelector(`#n_${id}`).value,description:document.querySelector(`#d_${id}`).value,price_thb:+document.querySelector(`#p_${id}`).value,active:document.querySelector(`#a_${id}`).checked})});alert('บันทึกแล้ว');refreshAll()}
</script></body></html>
